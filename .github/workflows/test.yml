name: test

# Two tiers, one workflow. Both gate the same events and share one concurrency
# group, so splitting them into separate files would only duplicate that config.
# The CI decision note (memory: ci-for-a-process-layer-repo) carries why the
# suites are split rather than all run at once.
#
# push is filtered to master on purpose. Unfiltered, a branch pushed for a pull
# request fires this workflow twice, once per event, running every suite two
# times for one change. Filtered, a branch is covered by its pull request and
# master is covered directly, with no overlap.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-test:
    name: bun test (TypeScript hook suite)
    # Pinned rather than ubuntu-latest so the image cannot move under the suite
    # between runs. ubuntu-latest already points at 24.04 and GitHub is
    # previewing 26.04; a pinned image fails loudly on a deliberate bump instead
    # of quietly on someone else's schedule.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: bun test
        run: bun test

  pester-test:
    name: Pester (fixture-built installer suites)
    # Windows, not Linux, and the first run of this workflow is why. It put this
    # tier on ubuntu-24.04 and Install-Account.Tests.ps1 failed on platform
    # assumptions rather than defects: a Windows drive letter in a path, and
    # assertions expecting `chmod` to be absent from PATH where Linux has it.
    #
    # These scripts target a Windows workstation, so running them where they are
    # valid is correct rather than a workaround. What it does not do is prove the
    # installer behaves on Linux. #151 is the pester-test-linux job below, which
    # covers that ground instead of hiding the gap behind a green check here.
    #
    # windows-latest is deliberately unpinned, unlike the bun job. The suites
    # depend on Windows path and drive semantics rather than on a particular
    # image's tool versions, and those semantics do not move between images.
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install-Harness.Tests.ps1 has a negative control asserting no "bun is not
      # on PATH" warning, so bun must be present, pinned the same as the bun job.
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # One step per suite, each a bare single-line run. tools/pr-review/verdict.ts
      # reads these lines at a PR's base to decide which .Tests.ps1 suites CI
      # covers; a `run: |` block or trailing text would not count.
      #
      # Install-Account.Tests.ps1 was once excluded here as coupled to one
      # machine. The failures on windows-latest were a hardcoded E: drive in its
      # -CoreRepo literals (Join-Path throws for a missing drive), not 1Password;
      # the literals now use C:.
      #
      # Invocation form matters. `pwsh -NoProfile -File <script>` exits non-zero
      # on a failing test; `pwsh -Command 'Invoke-Pester ...'` prints the failure
      # and still exits 0 (CONTRIBUTING.md, "Change process").
      - name: Restore-ClaudeProject.Tests.ps1
        run: pwsh -NoProfile -File install/Restore-ClaudeProject.Tests.ps1

      - name: Export-Account.Tests.ps1
        run: pwsh -NoProfile -File install/Export-Account.Tests.ps1

      - name: Install-Account.Tests.ps1
        run: pwsh -NoProfile -File install/Install-Account.Tests.ps1

      - name: Install-Harness.Tests.ps1
        run: pwsh -NoProfile -File install/Install-Harness.Tests.ps1

      - name: Account-Hooks.Tests.ps1
        run: pwsh -NoProfile -File install/Account-Hooks.Tests.ps1

  pester-test-linux:
    name: Pester (fixture-built installer suites, Linux)
    # #151: the same five suites the Windows job runs, on the platform the installer also
    # targets. This is a separate job rather than a matrix on pester-test above so the Windows
    # job's check name stays exactly "Pester (fixture-built installer suites)" -- the App
    # reviewer's REQUIRED_CHECKS (tools/pr-review/verdict.ts) matches on that literal name, and a
    # matrix suffixes each leg's check name with the runner value instead of keeping it stable.
    # Not added to REQUIRED_CHECKS here: whether this job becomes a required status check is a
    # branch-protection policy choice, left to the operator.
    #
    # Pinned to ubuntu-24.04, not ubuntu-latest, for the same reason as bun-test above: a fixed
    # image so the suites fail loudly on a deliberate version bump instead of quietly on GitHub's
    # own schedule.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install-Harness.Tests.ps1 has a negative control asserting no "bun is not
      # on PATH" warning, so bun must be present, pinned the same as the bun job.
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # Same suites, same invocation form and the same reason, as the Windows job above.
      - name: Restore-ClaudeProject.Tests.ps1
        run: pwsh -NoProfile -File install/Restore-ClaudeProject.Tests.ps1

      - name: Export-Account.Tests.ps1
        run: pwsh -NoProfile -File install/Export-Account.Tests.ps1

      - name: Install-Account.Tests.ps1
        run: pwsh -NoProfile -File install/Install-Account.Tests.ps1

      - name: Install-Harness.Tests.ps1
        run: pwsh -NoProfile -File install/Install-Harness.Tests.ps1

      - name: Account-Hooks.Tests.ps1
        run: pwsh -NoProfile -File install/Account-Hooks.Tests.ps1

  secret-scan:
    name: secret scan (Gitleaks)
    # #251. The pre-commit token scan (#232) is the cheap first refusal and stays. This job covers
    # what it cannot: secrets with no provider prefix, commit messages and touched paths, and any
    # commit made with --no-verify or from a clone without the hook. It scans the pull request's
    # own commit range, so master's existing history is never rescanned (a full-history baseline
    # was clean when this job was added).
    #
    # Pull requests only. On a push to master the range would be the merge, already scanned as
    # the pull request, so there is nothing for a push run to add.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      # The Gitleaks binary (MIT) pinned by version and sha256, invoked directly. No third-party
      # action: a binary checked against a hash needs nothing beyond the release asset, and it
      # sidesteps any licence-key question about gitleaks-action. The hash is the one the release
      # publishes in gitleaks_<version>_checksums.txt. A version bump changes both lines together.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Full history, because the range base..head needs both ends and their ancestry.
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      # The rules come from the base commit, never the pull request head. A config read from the
      # head lets a change allowlist its own secret and scan clean. When the base has no
      # .gitleaks.toml (the pull request that introduces it) the built-in defaults apply, written
      # to an explicit file because gitleaks would otherwise discover the head's copy in the
      # checkout. Any failure to read the base tree refuses the job.
      - name: Load the scanner config from the base commit
        run: |
          entry=$(git ls-tree "${BASE_SHA}" -- .gitleaks.toml) || { echo "::error::cannot read the base tree ${BASE_SHA}"; exit 1; }
          if [ -z "$entry" ]; then
            printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          else
            git show "${BASE_SHA}:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml" || { echo "::error::cannot read .gitleaks.toml at ${BASE_SHA}"; exit 1; }
          fi

      # A scanner that cannot detect anything passes every pull request. The planted value is
      # assembled at run time, so this file never holds a string a scan would flag, and the
      # check must see it in both a file and a piece of piped text (the commit message path).
      # Fails closed: anything other than exit 1 means the job cannot vouch for the range.
      - name: Scanner canary
        run: |
          canary_value='k8Dj29xPq4Lm7Zt1Wv5Rn3Bc6Hy0Fa2SeQ9'
          canary_dir="$RUNNER_TEMP/canary"
          mkdir -p "$canary_dir"
          printf 'api_%s = "%s"\n' key "$canary_value" > "$canary_dir/planted.txt"
          rc=0; "$RUNNER_TEMP/gitleaks" dir --no-banner --redact --log-level fatal --config "$RUNNER_TEMP/gitleaks.toml" "$canary_dir" || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::canary file was not detected (gitleaks exit $rc)"; exit 1; }
          rc=0; printf 'api_%s = "%s"\n' key "$canary_value" | "$RUNNER_TEMP/gitleaks" stdin --no-banner --redact --log-level fatal --config "$RUNNER_TEMP/gitleaks.toml" || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::canary text was not detected (gitleaks exit $rc)"; exit 1; }

      # gitleaks exits 0 when its own `git log` fails on a bad range, and an empty commit list
      # makes the message loop below a no-op, so an unresolvable range would otherwise read as a
      # clean scan. Resolve the range here and refuse when it does not.
      - name: Resolve the commit range
        run: |
          git rev-list "${BASE_SHA}..${HEAD_SHA}" > /dev/null || { echo "::error::commit range ${BASE_SHA}..${HEAD_SHA} does not resolve"; exit 1; }

      # Reports file, line, rule and short commit only. --redact keeps the value out of the
      # report, and the log level keeps gitleaks' own output down to counts.
      # --diff-merges=first-parent makes a merge commit show its diff against its first parent, so a
      # secret that exists only in a merge commit (a conflict resolution, an evil merge) is scanned.
      # Without it git log emits no diff for a merge and gitleaks counts the commit as scanned.
      - name: Scan the pull request's commits
        run: |
          report="$RUNNER_TEMP/files.json"
          rc=0; "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-level warn --config "$RUNNER_TEMP/gitleaks.toml" --log-opts "--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" --report-format json --report-path "$report" . || rc=$?
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -eq 1 ] && jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[0:7])"' "$report"; then exit 1; fi
          echo "::error::gitleaks could not complete (exit $rc)"
          exit 1

      # gitleaks git scans diffs, not commit messages, so each message and the paths the commit
      # touches go through the same rules as piped text. Names the commit and the rule, never the text.
      - name: Scan commit messages and paths
        run: |
          fail=0
          commits=$(git rev-list "${BASE_SHA}..${HEAD_SHA}") || { echo "::error::commit range does not resolve"; exit 1; }
          for c in $commits; do
            report="$RUNNER_TEMP/msg.json"
            text=$(git log -1 --diff-merges=first-parent --name-only --format=%B "$c") || { echo "::error::cannot read commit ${c:0:7}"; exit 1; }
            rc=0; printf '%s\n' "$text" | "$RUNNER_TEMP/gitleaks" stdin --no-banner --redact --log-level fatal --config "$RUNNER_TEMP/gitleaks.toml" --report-format json --report-path "$report" || rc=$?
            if [ "$rc" -eq 0 ]; then continue; fi
            fail=1
            if [ "$rc" -eq 1 ] && jq -r --arg c "$c" '.[] | "::error::\(.RuleID) in the message or paths of commit \($c[0:7])"' "$report"; then continue; fi
            echo "::error::gitleaks could not complete for commit ${c:0:7} (exit $rc)"
          done
          exit "$fail"
