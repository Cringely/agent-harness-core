<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="716" viewBox="0 0 1060 716" font-family="Segoe UI, Arial, sans-serif">
<rect width="1060" height="716" fill="#ffffff"/>
<text x="530.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">CYT1070 hand-wire aide — faikin32 (Daikin S21 to XIAO ESP32-C6)</text>
<text x="530.0" y="56" text-anchor="middle" font-size="13" fill="#555">Hold your module the same way as this drawing (Chan1 left, Chan2 right; top row = HV, bottom = LV). Use the two TXI/TXO columns; leave the RX columns empty.</text>
<rect x="260" y="150" width="520" height="176" rx="10" fill="#b3232a" stroke="#7a1015" stroke-width="2"/>
<text x="406" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#f4c9cb">Chan 1</text>
<text x="634" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#f4c9cb">Chan 2</text>
<text x="284" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#f4c9cb">HV</text>
<text x="756" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#f4c9cb">HV</text>
<text x="284" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#f4c9cb">LV</text>
<text x="756" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#f4c9cb">LV</text>
<circle cx="330" cy="200" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="330" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">TXO</text>
<polyline points="330,200 330,100 262,100" fill="none" stroke="#2e9b3c" stroke-width="3"/><rect x="214" y="90" width="48" height="20" rx="3" fill="#fff" stroke="#2e9b3c" stroke-width="2"/><text x="238" y="104" text-anchor="middle" font-size="10" fill="#2e9b3c">100-220Ω</text><text x="208" y="104" text-anchor="end" font-size="13" font-weight="700" fill="#2e9b3c">S21 pin 3 (Rx to aircon)</text>
<circle cx="406" cy="200" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="406" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#e8a9ab">RXI</text>
<g stroke="#e7c3c4" stroke-width="2"><line x1="400" y1="194" x2="412" y2="206"/><line x1="412" y1="194" x2="400" y2="206"/></g>
<circle cx="482" cy="200" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="482" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">HV</text>
<polyline points="482,200 482,150" fill="none" stroke="#d33" stroke-width="3"/><text x="482" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#d33">5 V</text>
<circle cx="558" cy="200" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="558" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">GND</text>
<polyline points="558,200 558,150" fill="none" stroke="#222" stroke-width="3"/><text x="558" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#222">GND</text>
<circle cx="634" cy="200" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="634" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#e8a9ab">RXI</text>
<g stroke="#e7c3c4" stroke-width="2"><line x1="628" y1="194" x2="640" y2="206"/><line x1="640" y1="194" x2="628" y2="206"/></g>
<circle cx="710" cy="200" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="710" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">TXO</text>
<polyline points="710,200 710,100 800,100" fill="none" stroke="#2b6fd6" stroke-width="3"/><rect x="800" y="90" width="48" height="20" rx="3" fill="#fff" stroke="#2b6fd6" stroke-width="2"/><text x="824" y="104" text-anchor="middle" font-size="10" fill="#2b6fd6">100-220Ω</text><text x="854" y="104" text-anchor="start" font-size="13" font-weight="700" fill="#2b6fd6">S21 pin 2 (Tx from aircon)</text>
<circle cx="330" cy="276" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="330" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">TXI</text>
<polyline points="330,276 330,368 262,368" fill="none" stroke="#2e9b3c" stroke-width="3"/><text x="256" y="372" text-anchor="end" font-size="13" font-weight="700" fill="#2e9b3c">XIAO  D6 / GPIO16 (TX)</text>
<circle cx="406" cy="276" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="406" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#e8a9ab">RXO</text>
<g stroke="#e7c3c4" stroke-width="2"><line x1="400" y1="270" x2="412" y2="282"/><line x1="412" y1="270" x2="400" y2="282"/></g>
<text x="406" y="344" text-anchor="middle" font-size="11" fill="#8a8a8a">leave empty</text>
<circle cx="482" cy="276" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="482" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">LV</text>
<polyline points="482,276 482,326" fill="none" stroke="#ef7d1a" stroke-width="3"/><text x="482" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#ef7d1a">3.3 V</text>
<circle cx="558" cy="276" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="558" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">GND</text>
<polyline points="558,276 558,326" fill="none" stroke="#222" stroke-width="3"/><text x="558" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#222">GND</text>
<circle cx="634" cy="276" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="634" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#e8a9ab">RXO</text>
<g stroke="#e7c3c4" stroke-width="2"><line x1="628" y1="270" x2="640" y2="282"/><line x1="640" y1="270" x2="628" y2="282"/></g>
<text x="634" y="344" text-anchor="middle" font-size="11" fill="#8a8a8a">leave empty</text>
<circle cx="710" cy="276" r="8" fill="#ffffff" stroke="#7a1015" stroke-width="1.5"/>
<text x="710" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">TXI</text>
<polyline points="710,276 710,368 800,368" fill="none" stroke="#2b6fd6" stroke-width="3"/><text x="806" y="372" text-anchor="start" font-size="13" font-weight="700" fill="#2b6fd6">XIAO  D7 / GPIO17 (RX)</text>
<rect x="60" y="430" width="712" height="88" rx="8" fill="#faf6ee" stroke="#e0d6c2"/><text x="76" y="454" font-size="14" font-weight="700" fill="#7a5a10">Power path</text><rect x="76" y="466" width="92" height="36" rx="4" fill="#fff" stroke="#6a1b9a"/><text x="122" y="483" text-anchor="middle" font-weight="700" font-size="12" fill="#6a1b9a">S21 pin 4</text><text x="122" y="497" text-anchor="middle" font-size="12" fill="#6a1b9a">~12 V</text><line x1="168" y1="484" x2="196" y2="484" stroke="#6a1b9a" stroke-width="3"/><rect x="196" y="466" width="90" height="36" rx="4" fill="#fff" stroke="#333"/><text x="241" y="483" text-anchor="middle" font-weight="700" font-size="12" fill="#111">250 mA</text><text x="241" y="497" text-anchor="middle" font-size="12" fill="#111">PTC fuse</text><line x1="286" y1="484" x2="314" y2="484" stroke="#6a1b9a" stroke-width="3"/><rect x="314" y="466" width="126" height="36" rx="4" fill="#fff" stroke="#333"/><text x="377" y="483" text-anchor="middle" font-weight="700" font-size="12" fill="#111">MP1584 buck</text><text x="377" y="497" text-anchor="middle" font-size="12" fill="#111">set to 5.0 V out</text><line x1="440" y1="484" x2="468" y2="484" stroke="#d33" stroke-width="3"/><rect x="468" y="466" width="128" height="36" rx="4" fill="#fff" stroke="#c22"/><text x="532" y="483" text-anchor="middle" font-weight="700" font-size="12" fill="#c22">5 V rail</text><text x="532" y="497" text-anchor="middle" font-size="12" fill="#c22">to HV + XIAO VBUS</text><text x="612" y="480" font-size="11" fill="#333">S21 pin 5 = GND</text><text x="612" y="496" font-size="11" fill="#333">(star ground at pin 5)</text>
<text x="800" y="454" font-size="14" font-weight="700" fill="#333">Wire colours</text><line x1="800" y1="470" x2="828" y2="470" stroke="#2e9b3c" stroke-width="3"/><text x="834" y="474" font-size="12" fill="#333">XIAO TX line (to aircon Rx)</text><line x1="800" y1="488" x2="828" y2="488" stroke="#2b6fd6" stroke-width="3"/><text x="834" y="492" font-size="12" fill="#333">aircon Tx line (to XIAO RX)</text><line x1="800" y1="506" x2="828" y2="506" stroke="#d33" stroke-width="3"/><text x="834" y="510" font-size="12" fill="#333">5 V</text><line x1="800" y1="524" x2="828" y2="524" stroke="#ef7d1a" stroke-width="3"/><text x="834" y="528" font-size="12" fill="#333">3.3 V</text><line x1="800" y1="542" x2="828" y2="542" stroke="#222" stroke-width="3"/><text x="834" y="546" font-size="12" fill="#333">GND</text><line x1="800" y1="560" x2="828" y2="560" stroke="#6a1b9a" stroke-width="3"/><text x="834" y="564" font-size="12" fill="#333">12 V</text>
<text x="60" y="566" font-weight="700" font-size="14" fill="#111">Key points</text><text x="60" y="588" font-size="12.5" fill="#444">1.  Put a 100-220 Ω resistor in each signal line, on the HV side (top row, the small boxes near S21 pins 2 and 3).</text><text x="60" y="608" font-size="12.5" fill="#444">2.  Only the two TXI / TXO (MOSFET) columns carry signal. The RXI / RXO divider columns stay empty.</text><text x="60" y="628" font-size="12.5" fill="#444">3.  Top row = HV side (5 V, faces aircon); bottom row = LV side (3.3 V, faces XIAO). Both GND pads are in column 4.</text><text x="60" y="648" font-size="12.5" fill="#444">4.  Firmware: invert false, UART on GPIO16 / 17 for this hand-wire build. S21 pin 1 (5 V ref) stays unused.</text><text x="60" y="668" font-size="12.5" fill="#444">5.  Both TX columns are bidirectional MOSFET lines, so there is no channel-direction trap as long as signals stay off the RX pads.</text><text x="60" y="688" font-size="12.5" fill="#444">6.  The XIAO 5 V power pad is silk-labeled <tspan font-weight="700">VBUS</tspan> on current units (same pad, USB 5 V).</text>
</svg>