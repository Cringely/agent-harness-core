StylesPath = styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.21.2/ai-tells.zip

[*.md]
BasedOnStyles = ai-tells, Cringely

# Disabled rules (conflicts with local contract): disable here, never delete from the package,
# so `vale sync` updates stay clean. Populate as false positives appear.
ai-tells.SemicolonUsage = NO
# Reason: the beautiful_prose contract explicitly sanctions semicolons as an em-dash replacement (prohibition 1).
ai-tells.VerbTricolon = NO
# Reason: fires on ANY three-item series, including earned procedural steps and option lists
# (documented misfire; user-approved disable 2026-07-10). The prompt contract still polices
# decorative tricolons at generation time. NOTE: eval scores recorded after this date are not
# comparable to BASELINE.md v1/v2 numbers until the calibration re-baseline lands.
ai-tells.ShipOveruse = NO
# Reason: replaced by Cringely.ShipRelease, which matches the release register instead of the
# word. Measured 2026-08-14 over 142 md files (~/.claude/rules, ~/.claude/skills,
# E:\projects\agent-harness-core minus worktrees): 27 findings, 20 of them senses the rule
# never meant to police — log transport to a SIEM, "ships with sample applications",
# vendor-shipped defaults, physical dispatch of printers, and a review-verdict enum literal
# ("SHIP" in .superpowers/sdd/progress.md). The upstream header refuses carve-outs and tells
# the writer to disable the whole rule for logistics prose; this takes that advice. The 7 true
# positives (rules/fix-quality.md, rules/no-overclaim.md) all re-fire under the replacement.
ai-tells.AnthropomorphicJustification = suggestion
# Reason: "load-bearing" is a genuine term of art here, and under the final config it is
# EVERY corpus finding this rule raises — 3 of 3, measured 2026-08-14 across the 142-file
# corpus (rules/fix-quality.md:21, skills/subagent-prompting/SKILL.md:54 and :85). Vale
# 3.15.1 has no per-token level, so this demotes all 81 tokens (counted as the list items
# under `tokens:` in styles/ai-tells/AnthropomorphicJustification.yml). Measured collateral:
# ZERO. The one non-"load-bearing" finding the demotion used to touch ("earns its place",
# skills/beautiful_prose/SKILL.md) sits in a document the exemption section below now covers
# in full, so there is nothing left to demote. Cost is a label only — every consumer of this
# kit runs `vale --output=line`, which prints no severity: the PostToolUse hook, the
# pre-commit gate, and the /prose-lint skill. Chosen over disable-and-reimplement because an
# 81-token copy in styles/Cringely/ would go stale silently on the next `vale sync` (which
# rewrites styles/ai-tells/ wholesale and leaves Cringely/ untouched). Latent cost: if
# MinAlertLevel ever rises above suggestion, those 81 clichés go quiet.

# ---------------------------------------------------------------------------
# REJECTED: a counter-annotation rule (Cringely.HumanCommonConstructions).
#
# "in order to", "the fact that", "tends to" and "as a result of" sit on
# Wikipedia's WikiProject AI Cleanup list of wording MORE common in human-written
# articles than in LLM output (drawing on Geng and Trotta on lexical and syntactic
# differences in LLM text, and Reinhart et al. on register variation). Stripping
# them on sight moves a document toward the model distribution, which is the
# opposite of what a de-AI pass is for. ai-tells.FillerPhrases carries three of
# them at error and ai-tells.FormalTransitions carries "As a result" at error.
#
# A local rule flagging the same four at `suggestion` with a "keep it" message was
# written, measured and REMOVED on 2026-08-14. Three reasons, all measured:
#
#   1. Its entire corpus output was contradiction. All 3 findings across the
#      142-file corpus landed on a span already flagged by ai-tells.FillerPhrases
#      — one alert saying "Delete this phrase", one saying "do not strip it".
#      Zero standalone findings, ever.
#   2. Severity is the only thing that ranks the pair, and no consumer prints it.
#      Vale 3.15.1 offers "line", "JSON", or a Go template file (`vale --help`);
#      the PostToolUse hook, the repo pre-commit gate and the /prose-lint skill
#      all use --output=line, which carries no severity.
#   3. Print order is nondeterministic. Six consecutive runs over one fixture put
#      the counter-annotation BEFORE the alert it counters in 2 of 6. So even
#      with severity printed, the pair does not read as alert-then-adjudication.
#
# Rejected alternatives, with the cost that rejected them:
#   - Demote or disable the two upstream rules and reimplement them minus the four
#     constructions: 70 + 68 tokens hand-copied (counted as list items under
#     `tokens:` in styles/ai-tells/FillerPhrases.yml and FormalTransitions.yml),
#     and a hand copy goes stale silently on the next `vale sync`. 31 corpus
#     findings would ride on the copy staying correct.
#   - Teach all three consumers to print severity: three files across two repos
#     plus a template to keep in sync, and it does not remove the second alert.
#
# The counter-signal that replaced the rule is prose, and it is in exactly one
# place: the section "Four Alerts the Linter Gets Backwards" in
# ~/.claude/rules/writing-style.md, added 2026-08-14 in the same round that deleted
# the rule. That section names all four constructions and the rule that flags each,
# gives the WikiProject / Geng and Trotta / Reinhart et al. provenance, tells the
# writer to overrule the alert, keeps the long forms ("due to the fact that" and
# siblings) banned, and states that no mechanical guard backs any of it.
# Mechanically all four stay at error here. If that section is renamed or removed,
# this block becomes false and the four constructions lose their only defence.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Path sections. A matching section REPLACES the style set when it names
# BasedOnStyles, so these must sit AFTER [*.md]. Per-rule wildcards do not
# exist (Cringely.* = NO is ignored); each rule is named in full.
# ---------------------------------------------------------------------------

# The project noun. E:\projects\agent-harness-core is named for the word, and every
# occurrence of "harness" in it is the noun ("this harness", "an agent harness",
# "Agent Harness Core"), never the banned verb ("harness the power of"). Measured
# 2026-08-14: 13 of the repo's 23 findings are that one token, all from
# Cringely.Vocabulary.
#
# ai-tells.OverusedVocabularyVerbs is deliberately NOT disabled here, and was
# briefly disabled by mistake. It is extends: sequence, so on the ungrammatical
# "We agent-harness-core the thing" it tags the whole hyphenated repo name — but
# that shape does not occur in English. Measured 2026-08-14 with the rule left
# on: zero findings across all 32 markdown files in the repo, and zero across 13
# realistic project-noun sentences including the imperative shapes most likely
# to be verb-tagged ("Install agent-harness-core into the project root."). The
# cost of disabling it was the rule's 7 verb lemmas (leverage, navigate,
# showcase, harness, embark, foster, spearhead) and their inflections all going
# silent inside the repo — harness among them, which is the exact verb sense
# this section claims never occurs and the only rule left that would catch it.
#
# Cost, measured 2026-08-14 by linting a one-token-per-line fixture at a path
# inside this glob and the identical bytes at a path outside it. Of the rule's 34
# tokens, 23 are still caught here by sibling ai-tells rules that stay on:
#   18  ai-tells.OverusedVocabulary  comprehensive, crucial, delve, empower,
#       holistic, innovative, nuanced, paradigm, pivotal, robust, seamless,
#       state-of-the-art, streamline, synergy, tapestry, transformative,
#       unprecedented, vital
#    3  ai-tells.FormalRegister      facilitate, operationalize, utilize
#    2  ai-tells.AICompoundPhrases   cutting-edge, game-changer
# Genuinely uncovered as a bare token, 11: dive into, ecosystem, essential,
# foster, harness, highlight, landscape, leverage, realm, revolutionary,
# underscore. Three of those 11 (harness, foster, leverage) are still caught in
# VERB position by ai-tells.OverusedVocabularyVerbs, which stays on — verified
# with a verb-sense fixture inside this glob, all seven of that rule's lemmas
# and their inflections firing. True positives lost on today's corpus: zero.
#
# TokenIgnores was tried first and REJECTED on measurement: it is honoured only in
# the [*.md] format section (four path-glob spellings tested, all silently ignored),
# and a pattern that matches inside an inline code span corrupts Vale's code-span
# masking — `((?i)\w+-harness\b)` made CONTRIBUTING.md go from 1 finding to 5 by
# exposing `install/Install-Harness.ps1` inside backticks. An in-file
# `<!-- vale Cringely.Vocabulary = NO -->` comment was rejected because it would
# have to be repeated in 9 files today and in every new document after.
#
# KNOWN GAP — two ways this section fails to match, not one. Both measured 2026-08-14.
#   1. The repo pre-commit hook lints a blob extracted to a scratch tree
#      ($scratch_dir/$f) with the repo name stripped from the path, so this glob
#      cannot match under the commit gate at all.
#   2. A section glob is matched against the path AS HANDED TO VALE ON THE COMMAND
#      LINE, so a relative invocation from inside the repo defeats it. This is the
#      same trap that broke the writing-style.md exemption below and got that
#      spelling reverted the same day.
#        vale --config <this> E:\projects\agent-harness-core\README.md
#          -> 1 finding, Cringely.Vocabulary 0
#        cd E:\projects\agent-harness-core; vale --config <this> README.md
#          -> 4 findings, Cringely.Vocabulary 3, all three on 'harness' the noun
#      Pre-existing rather than introduced by the 2026-08-14 round, and left as a gap
#      on purpose: see below.
# The in-file `<!-- vale ... = NO -->` fix used for writing-style.md does NOT transfer
# here. That fix is one directive per document, which for this glob is the 9 files
# already named above plus every new document after — the same cost that rejected the
# in-file comment earlier in this block. One change closes both gaps instead: a
# repo-vendored .claude/tools/prose-lint/.vale.ini, which the pre-commit hook prefers
# and which would carry these rules under [*.md] with no path glob to defeat.
[**/agent-harness-core/**]
BasedOnStyles = ai-tells, Cringely
Cringely.Vocabulary = NO

# Style contracts cannot be linted by the style they define. Both documents exist to
# enumerate banned language, so nearly every finding in them is the linter hitting a
# quoted example. Measured 2026-08-14 with each document's exemption lifted:
# rules/writing-style.md raises 104 findings across 24 rules, and
# skills/beautiful_prose/SKILL.md raises 75 across 15; SKILL.md line 23 alone carries
# ~34 banned tokens on one line. (An earlier note here put writing-style.md at 100 and
# added the two to "175 of the corpus's 1234, or 14%". Both documents have been edited
# since, and 1234 was the pre-exemption corpus, so that composite is retired rather
# than corrected.) One exemption per document covers every rule at once, which is why
# the section below zeroes the style set instead of listing per-rule disables that
# would need extending every time the document quotes a new rule.
#
# Deliberately NOT exempted: skills/prose-lint/SKILL.md (2 findings, and it names rules
# rather than quoting vocabulary) and tools/prose-lint/fixtures/ (sloppy.md must keep
# firing — it is the kit's own smoke test).
#
# ---- writing-style.md is NOT exempted from this file. Read this before adding it back.
#
# Its exemption is an in-file `<!-- vale off -->` on line 1 of
# ~/.claude/rules/writing-style.md. Both path spellings were tried here and both are
# worse, because a section glob is matched against the path AS HANDED TO VALE ON THE
# COMMAND LINE, not against a resolved absolute path:
#
#   [**/writing-style.md]               exempts the real file under any invocation, and
#                                       silently exempts any stray file of that name
#                                       anywhere on disk. Zero findings reads as a clean
#                                       document, so that failure is invisible.
#   [**/.claude/rules/writing-style.md] exempts the real file ONLY when the caller passes
#                                       a path carrying those segments. Measured
#                                       2026-08-14: `cd ~/.claude/rules; vale --config
#                                       <this> writing-style.md` -> 102 findings, against
#                                       0 for the absolute path. That is not academic:
#                                       skills/prose-lint/SKILL.md:14 documents the
#                                       invocation as `"<target-file>"` and an agent
#                                       lints the file it is looking at. This spelling
#                                       shipped on 2026-08-14 and was reverted the same
#                                       day, having regressed a case that worked.
#
# Carrying BOTH was measured and rejected as dead config. Two matching sections COMBINE
# rather than last-wins — verified by giving them different bodies, `BasedOnStyles =` in
# the anchored one and `Cringely.Vocabulary = NO` in the bare one, which zeroed the file
# under an absolute path (union applied) and left 66 of 102 under a relative one (only
# the bare section matched). So the union of the two is exactly the broader glob, the
# anchored one changes nothing, and the stray-file hole is reopened in full.
#
# The in-file directive beats every path spelling on the measurements that matter:
#   - Path-independent: 0 findings under both the absolute path and a bare filename from
#     inside the directory, with no section present at all. This whole trap class
#     cannot reach it.
#   - Closes the stray-file hole harder than the anchor did. The exemption travels with
#     the bytes, so a DIFFERENT document named writing-style.md lints wherever it sits,
#     including at another project's .claude/rules/writing-style.md, which the anchored
#     glob would have exempted. Measured: the same bytes with the directive stripped
#     raise 104. (Only one writing-style.md exists on disk today, so this hole was
#     always theoretical — but it now costs nothing to keep shut.)
#   - Needs no `= NO` repeat for a rule given a level in [*.md]. The directive suppresses
#     `ai-tells.AnthropomorphicJustification = suggestion` with no extra line; the zeroed
#     style set below still needs one. That footgun is documented immediately below.
#
# Cost, stated plainly, three items. Five lines of Vale plumbing now sit at the top of a
# rules file that is injected into every session's context. A pipeline that strips HTML
# comments would drop the exemption, and that failure is loud (104 findings today), not
# silent. The third is the one to watch, because it IS silent: the directive travels by
# quotation. Measured 2026-08-14 on a document with 13 findings, quoting `<!-- vale off -->`
# inside a BLOCKQUOTE took it to 0, while quoting the same string inside a fenced code block
# left all 13. So any document that explains this mechanism in prose, a bullet, a table cell
# or a blockquote silences itself from that point down and reads as clean. Document the
# directive only inside a fence. This is the same class of invisible over-exemption that
# rejected the bare glob above, and it is not free here either; it is merely cheaper.
#
# ---- end writing-style.md note
#
# MEASURED, 2026-08-14: emptying BasedOnStyles does NOT silence a rule that was
# given an explicit level in [*.md]. `ai-tells.AnthropomorphicJustification =
# suggestion` above kept firing in beautiful_prose/SKILL.md ("earns its place")
# until it was named again below. A rule set to NO does not leak this way; only a
# level assignment does. Any future `<rule> = <level>` line in [*.md] has to be
# repeated as `= NO` in the section below or it will reappear there.
#
# ANCHORED ON PATH, not on filename. Every copy of this skill on disk sits under a
# `skills/` segment — surveyed 2026-08-14, 6 of 6 (the account copy, two project
# installs, three worktree checkouts). A directory named beautiful_prose that is
# NOT a skill copy is a plausible place to keep prose deliverables, and it should
# be linted like any other.
#
# KNOWN GAP, same trap as writing-style.md above: this section matches only when the
# caller hands Vale a path containing a `skills/` segment. Measured 2026-08-14,
# `cd ~/.claude/skills/beautiful_prose; vale --config <this> SKILL.md` -> 75 findings,
# and `cd ~/.claude/skills; vale --config <this> beautiful_prose\SKILL.md` -> 75, both
# against 0 for the absolute path. The in-file fix used for writing-style.md is not
# available here: SKILL.md belongs to the skill, not to this kit, so the section stays
# and the precondition is written down instead. Absolute paths are safe; the two write
# hooks and the repo pre-commit gate all pass them. skills/prose-lint/SKILL.md:14 does
# not, and that is the one consumer that can trip on this.
[**/skills/beautiful_prose/**]
BasedOnStyles =
ai-tells.AnthropomorphicJustification = NO
